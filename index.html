<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرة الرياضيات ٥ انتقل إلى عنوان جديد</title>
<style>body{font-family:system-ui,sans-serif;background:#EEF6FF;color:#0E2A47;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}a{color:#0B67D1;font-weight:800}</style></head>
<body><main><h1>٥ مغامرة الرياضيات ٥ انتقل</h1><p>العنوان الجديد: <a id="go" href="https://halimfaroug.github.io/math5/">halimfaroug.github.io/math5/</a></p><p>جارٍ نقلكم مع تقدّمكم المحفوظ…</p></main>
<script>(function(){var url="https://halimfaroug.github.io/math5/",keys=["tokens", "completedEx"],d={},n=0;
try{keys.forEach(function(k){var v=localStorage.getItem(k);if(v!==null){d[k]=v;n++}})}catch(e){}
if(n)url+="#carry="+btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
document.getElementById("go").href=url;setTimeout(function(){location.replace(url)},400)})();</script>
</body></html>
