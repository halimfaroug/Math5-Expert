  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n\n/* Warm challenge additions */\n.warm-challenge{margin-top:34px;padding:28px;border:1px solid #f2b880;background:linear-gradient(135deg,#fff8ef 0%,#fff0df 55%,#ffe4d1 100%);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(143,65,25,.12)}\n.warm-challenge:before{content:\"\";position:absolute;inset:-60px auto auto -40px;width:180px;height:180px;border-radius:50%;background:#ffd08a;opacity:.28;animation:warmFloat 7s ease-in-out infinite}\n.warm-kicker{color:#a34d1d;font-size:11px;letter-spacing:.12em;font-weight:800;margin-bottom:8px}\n.warm-title{color:#7d3218;margin-bottom:8px}.warm-subtitle{color:#8b5a3c;max-width:680px}\n.warm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px;position:relative}\n.warm-card{background:rgba(255,255,255,.8);border:1px solid #f2c59d;padding:16px;animation:warmRise .7s both;transition:transform .2s ease,box-shadow .2s ease}\n.warm-card:nth-child(2){animation-delay:.08s}.warm-card:nth-child(3){animation-delay:.16s}.warm-card:nth-child(4){animation-delay:.24s}.warm-card:nth-child(5){animation-delay:.32s}.warm-card:nth-child(6){animation-delay:.4s}.warm-card:nth-child(7){animation-delay:.48s}.warm-card:nth-child(8){animation-delay:.56s}\n.warm-card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(143,65,25,.14)}\n.warm-num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;background:#c85b2b;color:#fff;border-radius:50%;font-weight:800;margin-bottom:10px}\n.warm-card summary{cursor:pointer;color:#713116;font-weight:700;line-height:1.5}.warm-card summary::-webkit-details-marker{color:#c85b2b}\n.warm-answer{margin:12px 0 0;padding:10px 12px;border-right:3px solid #e9935c;background:#fff4e8;color:#754326;font-size:14px}\n.warm-related{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.warm-related .btn{background:#fff;color:#8d3d1a;border-color:#e7aa77}.warm-related .btn:hover{background:#ffe9d3}\n@keyframes warmRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes warmFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,12px)}}\n@media (prefers-reduced-motion:reduce){.warm-card,.warm-challenge:before{animation:none}.warm-card{transition:none}}\n\n<\u002Fstyle>\n<script src=\"c83a3f26-09f1-4cd8-81e0-2d81213d321e\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* arabic */\n@font-face {\n  font-family: 'IBM Plex Sans Arabic';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"94c3267d-b2a3-428c-b147-508134625ec7\") format('woff2');\n  unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC4, U+10EFC-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE29-1EE32, U+1EE34-1EE37, U+1EE39, U+1EE3B, U+1EE42, U+1EE47, U+1EE49, U+1EE4B, U+1EE4D-1EE4F, U+1EE51-1EE52, U+1EE54, U+1EE57, U+1EE59, U+1EE5B, U+1EE5D, U+1EE5F, U+1EE61-1EE62, U+1EE64, U+1EE67-1EE6A, U+1EE6C-1EE72, U+1EE74-1EE77, U+1EE79-1EE7C, U+1EE7E, U+1EE80-1EE89, U+1EE8B-1EE9B, U+1EEA1-1EEA3, U+1EEA5-1EEA9, U+1EEAB-1EEBB, U+1EEF0-1EEF1;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Sans Arabic';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"91ef2f4f-3cf7-49b5-9fe5-53abf7eabc4f\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2 ><span style=\"font-size:10px;letter-spacing:.06em;color:var(--color-neutral-700)\">النقاط<\u002Fspan><span class=\"num\" style=\"font-size:17px;font-weight:700\">{{ points }}<\u002Fspan><\u002Fdiv>\n    <div style=\"width:2px;height:26px;background:var(--color-divider)\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;line-height:1.1\"><span style=\"font-size:10px;letter-spacing:.06em;color:var(--color-neutral-700)\">قوة الرياضيات<\u002Fspan><span class=\"num\" style=\"font-size:17px;font-weight:700\">{{ level }}<\u002Fspan><\u002Fdiv>\n    <div style=\"width:2px;height:26px;background:var(--color-divider)\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;line-height:1.1\"><span style=\"font-size:10px;letter-spacing:.06em;color:var(--color-neutral-700)\">أيام متتالية<\u002Fspan><span class=\"num\" style=\"font-size:17px;font-weight:700\">{{ streak }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:6px;align-items:center\">\n    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goHome }}\">الرئيسية<\u002Fbutton>\n    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goLab }}\">المختبر<\u002Fbutton>\n    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goTeacher }}\">لوحة المتابعة<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"max-width:1180px;margin:0 auto;padding:36px 24px 90px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:end\">\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.14em;color:var(--color-accent-700);margin-bottom:10px\">الرياضيات — الصف الخامس الابتدائي — الجزء الأول<\u002Fdiv>\n        <h1 style=\"font-size:clamp(32px,5.2vw,58px);margin:0 0 10px;line-height:1.08\">مغامرة الرياضيات للصف الخامس<\u002Fh1>\n        <p style=\"font-size:19px;margin:0;color:var(--color-neutral-800)\">تعلم – جرّب – اكتشف – حلّ – أتقن<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-size:15px;color:var(--color-neutral-800);margin:0\">كل نشاط يُحلّ بالسحب والبناء والتجريب، لا بالقراءة. ومعه مختبر مفتوح للتجربة الحرة. تقدّمك محفوظ على هذا الجهاز.<\u002Fp>\n    <\u002Fdiv>\n    <hr class=\"hr\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:2px solid var(--color-divider)\">\n      <sc-for list=\"{{ topStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"padding:14px 18px;border-inline-start:2px solid var(--color-divider)\">\n          <div style=\"font-size:11px;letter-spacing:.08em;color:var(--color-neutral-700)\">{{ s.label }}<\u002Fdiv>\n          <div class=\"num\" style=\"font-size:30px;font-weight:700;line-height:1.2\">{{ s.value }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <hr class=\"hr\">\n    <h4 style=\"margin:0 0 14px\">الفصول<\u002Fh4>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--color-divider);border:2px solid var(--color-divider)\">\n      <sc-for list=\"{{ chapters }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <button type=\"button\" data-ch=\"{{ c.id }}\" sc-camel-on-click=\"{{ openChapter }}\" style=\"text-align:right;font-family:inherit;color:inherit;border:0;cursor:pointer;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:215px;background:var(--color-neutral-100)\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px\">\n            <span class=\"num\" style=\"font-size:46px;font-weight:700;line-height:.85;color:var(--color-accent)\">{{ c.n }}<\u002Fspan>\n            <span style=\"flex:1\">\n              <span style=\"display:block;font-size:22px;font-weight:700;line-height:1.25\">{{ c.t }}<\u002Fspan>\n              <span style=\"display:block;font-size:13px;color:var(--color-neutral-700);margin-top:6px\">{{ c.s ghost\" sc-camel-on-click=\"{{ goHome }}\">→ كل الفصول<\u002Fbutton>\n    <div style=\"display:flex;align-items:flex-end;gap:18px;margin-top:8px;flex-wrap:wrap\">\n      <span class=\"num\" style=\"font-size:64px;font-weight:700;line-height:.85;color:var(--color-accent)\">{{ curCh.n }}<\u002Fspan>\n      <div style=\"flex:1;min-width:220px\">\n        <h2 style=\"margin:0\">{{ curCh.t }}<\u002Fh2>\n        <p style=\"margin:4px 0 0;color:var(--color-neutral-700);font-size:14px\">{{ curCh.s }}<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"num\" style=\"font-size:30px;font-weight:700\">{{ curCh.pctLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <hr class=\"hr\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:2px;background:var(--color-divider);border:2px solid var(--color-divider)\">\n      <sc-for list=\"{{ chapterActs }}\" as=\"a\" hint-placeholder-count=\"5\">\n        <button type=\"button\" data-act=\"{{ a.id }}\" sc-camel-on-click=\"{{ openAct }}\" style=\"text-align:right;font-family:inherit;color:inherit;border:0;cursor:pointer;background:var(--color-neutral-100);padding:20px;display:flex;flex-direction:column;gap:10px;min-height:180px\">\n          <span style=\"font-size:11px;letter-spacing:.06em;color:var(--color-accent-700)\">{{ a.k }}<\u002Fspan>\n          <span style=\"font-size:20px;font-weight:700;line-height:1.25\">{{ a.t }}<\u002Fspan>\n          <span style=\"font-size:13px;color:var(--color-neutral-700);flex:1\">{{ a.d }}<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px;font-size:12px\">\n            <span style=\"width:14px;height:14px;border:2px solid var(--color-text);background:{{ a.mBg }}\"><\u002Fspan>\n            <span>{{ a.mLabel }}<\u002Fspan>\n            <span class=\"num\" style=\"margin-inline-start:auto;color:var(--color-neutral-700)\">{{ a.score }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n< clamp(24px,5.6vw,46px);font-weight:700;border:2px solid var(--color-text);background:var(--color-neutral-100);padding:18px 28px;text-align:center;animation:rise .25s\">{{ mcqDisplay }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasBars }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;width:100%;max-width:560px\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"2\">\n                <div>\n                  <div class=\"num\" style=\"font-size:15px;font-weight:700;margin-bottom:4px\">{{ b.label }}<\u002Fdiv>\n                  <div style=\"display:flex;border:2px solid var(--color-text);height:46px\">\n                    <sc-for list=\"{{ b.parts }}\" as=\"p\" hint-placeholder-count=\"4\">\n                      <div style=\"flex:1;border-inline-start:2px solid var(--color-text);background:{{ p.bg }}\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font-size:17px;font-weight:600;text-align:center;max-width:720px;line-height:1.6\">{{ mcqPrompt }}<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:800px\">\n            <sc-for list=\"{{ mcqOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button type=\"button\" data-g=\"opt\" data-v=\"{{ o.v }}\" sc-camel-on-click=\"{{ onOpt }}\" style=\"font-family:inherit;font-size:17px;font-weight:600;padding:14px 20px;cursor:pointer;max-width:360px;text-align:right;border:2px solid var(--color-text);background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ k_entry }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:colu laceholder-count=\"3\">\n                    <button type=\"button\" data-i=\"{{ c.i }}\" sc-camel-on-click=\"{{ onSlot }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drop=\"{{ onSlot }}\" style=\"width:60px;height:84px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:2px solid var(--color-text);background:{{ c.bg }}\">\n                      <span class=\"num\" style=\"font-size:30px;font-weight:700;line-height:1;color:{{ c.fg }}\">{{ c.ch }}<\u002Fspan>\n                      <span style=\"direction:rtl;font-size:9px;text-align:center;color:{{ c.lfg }}\">{{ c.label }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:58px\">\n            <sc-for list=\"{{ pvTiles }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <button type=\"button\" draggable=\"true\" data-id=\"{{ t.id }}\" sc-camel-on-click=\"{{ onTile }}\" sc-camel-on-drag-start=\"{{ onTile }}\" class=\"num\" style=\"width:56px;height:56px;font-size:26px;font-weight:700;font-family:inherit;cursor:grab;animation:pop .2s;border:2px solid var(--color-text);background:{{ t.bg }};color:{{ t.fg }}\">{{ t.v }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;color:var(--color-neutral-700);text-align:center\">اسحب البطاقة إلى الخانة، أو اضغط البطاقة ثم اضغط الخانة. اضغط خانة ممتلئة لإرجاع رقمها.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ k_detective }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"direction:ltr;display:flex;justify-content:center;gap:3px;flex-wrap:wrap\">\n            <sc-for list=\"{{ dtDigi v>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <hr class=\"hr\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:22px\">\n      <div>\n        <h4 style=\"margin:0 0 8px\">أقوى المهارات<\u002Fh4>\n        <ul style=\"margin:0;padding-inline-start:18px;font-size:15px;line-height:1.9\">\n          <sc-for list=\"{{ tStrong }}\" as=\"x\" hint-placeholder-count=\"3\"><li>{{ x.label }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n        <sc-if value=\"{{ tNoStrong }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:14px;color:var(--color-neutral-700);margin:0\">لا بيانات كافية بعد.<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"margin:0 0 8px\">تحتاج مراجعة<\u002Fh4>\n        <ul style=\"margin:0;padding-inline-start:18px;font-size:15px;line-height:1.9\">\n          <sc-for list=\"{{ tWeak }}\" as=\"x\" hint-placeholder-count=\"3\"><li>{{ x.label }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n        <sc-if value=\"{{ tNoWeak }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:14px;color:var(--color-neutral-700);margin:0\">لا أخطاء متكررة حتى الآن.<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>النشاط<\u002Fsc-raw-th><sc-raw-th>الفصل<\u002Fsc-raw-th><sc-raw-th>محاولات<\u002Fsc-raw-th><sc-raw-th>صحيحة<\u002Fsc-raw-th><sc-raw-th>الدقة<\u002Fsc-raw-th><sc-raw-th>الإتقان<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ tRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <sc-raw-tr>\n            <sc-raw-td>{{ r.t }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"color:var(--color-neutral-700)\">{{ r.ch }}<\u002Fsc-raw-td>\n            <sc-raw-td class=\"num\">{{ r.a }}<\u002Fsc-raw-td>\n            <sc-raw-td class=\"num\">{{ r.c }}<\u002Fsc-raw-td>\n            <sc-raw-td>\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"flex:1;min-width:60px;height:8px;background:var(--color-neutral-300)\"><div style=\"height:100%;background:var(--color-accent);width:{{ r.pct }}\"><\u002Fdiv><\u002Fdiv>\n                <span class=\"num\" style=\"font-size:13px\">{{ r.pctLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-raw-td>\n            <sc-raw-td><span style=\"display:inline-flex;align-items:center;gap:6px;font-size:13px\"><span style=\"width:12px;height:12px;border:2px solid var(--color-text);background:{{ r.mBg }}\"><\u002Fspan>{{ r.mLabel }}<\u002Fspan><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fmain>\n<\u002Fsc-if>\n\n\n<section class=\"warm-challenge\" aria-labelledby=\"warm-challenge-title\">\n  <div class=\"warm-kicker\">تحدّي دافئ — اختبر نفسك</div>\n  <h2 id=\"warm-challenge-title\" class=\"warm-title\" style=\"font-size:clamp(25px,3vw,36px)\">محطة التمارين الجديدة</h2>\n  <p class=\"warm-subtitle\">ثمانية اختبارات قصيرة من موضوعات الصف الخامس. فكّر أولًا، ثم افتح بطاقة الإجابة للتحقق من طريقتك.</p>\n  <div class=\"warm-grid\">\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">١</span><br>قرّب العدد ٤٬٧٦٨ إلى أقرب مئة.</summary><p class=\"warm-answer\">الإجابة: <strong>٤٬٨٠٠</strong>؛ لأن رقم العشرات ٦، فنقرّب المئات إلى الأعلى.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٢</span><br>أوجد: ٣٬٤٥٠ + ٢٬٧٨٥.</summary><p class=\"warm-answer\">الإجابة: <strong>٦٬٢٣٥</strong>. اجمع الآحاد ثم العشرات فالمئات والآلاف.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٣</span><br>أوجد: ٧٢ × ٦.</summary><p class=\"warm-answer\">الإجابة: <strong>٤٣٢</strong>؛ ٧٠ × ٦ = ٤٢٠ و٢ × ٦ = ١٢.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٤</span><br>قسّم ٩٦ على ٨.</summary><p class=\"warm-answer\">الإجابة: <strong>١٢</strong>؛ لأن ٨ × ١٢ = ٩٦.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٥</span><br>أيّهما أكبر: ٣/٤ أم ٢/٣؟</summary><p class=\"warm-answer\">الإجابة: <strong>٣/٤</strong>؛ بالمقارنة بالضرب التبادلي: ٣×٣=٩ و٢×٤=٨.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٦</span><br>إذا كان س + ١٧ = ٤٢، فما قيمة س؟</summary><p class=\"warm-answer\">الإجابة: <strong>س = ٢٥</strong>؛ اطرح ١٧ من الطرفين.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٧</span><br>مستطيل طوله ٩ سم وعرضه ٤ سم. ما مساحته؟</summary><p class=\"warm-answer\">الإجابة: <strong>٣٦ سم²</strong>؛ المساحة = الطول × العرض = ٩ × ٤.</p></details>\n    <details class=\"warm-card\"><summary><span class=\"warm-num\">٨</span><br>مع سارة ٥٠ ريالًا، دفعت ٣٦. كم تبقّى؟</summary><p class=\"warm-answer\">الإجابة: <strong>١٤ ريالًا</strong>؛ ٥٠ − ٣٦ = ١٤.</p></details>\n  </div>\n  <div class=\"warm-related\">\n    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goLab }}\">جرّب المختبر التفاعلي</button>\n    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goTeacher }}\">راجع تقدّمك</button>\n  </div>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:820}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    this.KEY='math5_prog_v1';\n    this.LVL=['سهل','متوسط','متقدم','خبير'];\n    this.PLACE=['الآحاد','العشرات','المئات','الألوف','عشرات الألوف','مئات الألوف','الملايين','عشرات الملايين','مئات الملايين','المليارات','عشرات المليارات','مئات المليارات'];\n    this.PERIOD=['الآحاد','الألوف','الملايين','المليارات'];\n    this.CH=[\n      {id:'ch1',n:1,t:'القيمة المنزلية',s:'الأعداد حتى المليارات، والكسور العشرية ومقارنتها'},\n      {id:'ch2',n:2,t:'الجمع والطرح',s:'التقريب والتقدير، والجمع والطرح وحل المسائل'},\n      {id:'ch3',n:3,t:'الضرب',s:'الأنماط ونموذج المساحة وخاصية التوزيع'},\n      {id:'ch4',n:4,t:'القسمة',s:'النماذج والقسمة المطولة وتفسير الباقي'},\n      {id:'ch5',n:5,t:'العبارات الجبرية والمعادلات',s:'المتغيرات وآلات الدوال وترتيب العمليات والميزان'},\n      {id:'ch6',n:6,t:'الكسور الاعتيادية',s:'الكسور غير الفعلية والأعداد الكسرية والمقارنة'}\n    ];\n    this.ACT=[\n      {id:'pvm',ch:'ch1',kind:'pvm',t:'آلة القيمة المنزلية',k:'سحب وإفلات',d:'اسحب الأرقام إلى جدول المنازل لتبني العدد المقروء'},\n      {id:'detective',ch:'ch1',kind:'detective',t:'المحقق العددي',k:'تحقيق',d:'حدّد منزلة الرقم المظلَّل وقيمته داخل العدد'},\n      {id:'expanded',ch:'ch1',kind:'entry',t:'ابنِ العدد',k:'بناء عدد',d:'حوّل الصيغة التحليلية إلى الصيغة القياسية'},\n      {id:'battle',ch:'ch1',kind:'mcq',t:'معركة المقارنة',k:'مقارنة',d:'أكبر من، أصغر من، أم يساوي؟ أعدادٌ كبيرة وكسور عشرية'},\n      {id:'ordering',ch:'ch1',kind:'order',t:'ترتيب الأعداد',k:'ترتيب',d:'رتّب الأعداد من الأصغر إلى الأكبر'},\n      {id:'numline1',ch:'ch1',kind:'numline',t:'خط الأعداد التفاعلي',k:'تحديد موقع',d:'ضع العدد في موقعه الصحيح على خط الأعداد'},\n      {id:'rounding',ch:'ch2',kind:'mcq',t:'التقريب',k:'تقريب',d:'قرّب العدد إلى المنزلة المطلوبة'},\n      {id:'estimate',ch:'ch2',kind:'entry',t:'قدّر أولًا',k:'تقدير',d:'قدّر ناتج الجمع أو الطرح بالتقريب قبل الحساب'},\n      {id:'addcol',ch:'ch2',kind:'columns',t:'محاكي الجمع الرأسي',k:'حساب بالأعمدة',d:'اجمع بالمنازل واستعمل صف الحمل'},\n      {id:'subcol',ch:'ch2',kind:'columns',t:'محاكي الطرح والاستلاف',k:'حساب بالأعمدة',d:'اطرح بالمنازل مع الاستلاف'},\n      {id:'errfind',ch:'ch2',kind:'mcq',t:'محقق الأخطاء',k:'اكتشاف خطأ',d:'حسابٌ خاطئ — أين الخطأ بالضبط؟'},\n      {id:'shopping',ch:'ch2',kind:'entry',t:'تحدي السوق',k:'مسألة واقعية',d:'أثمان وميزانيات بالريال السعودي'},\n      {id:'mpattern',ch:'ch3',kind:'entry',t:'مستكشف أنماط الضرب',k:'نمط',d:'اكتشف نمط الأصفار في الضرب'},\n      {id:'areamodel',ch:'ch3',kind:'area',t:'بانِي نموذج المساحة',k:'نموذج بصري',d:'ابنِ المستطيل وقسّمه لترى الضرب'},\n      {id:'distrib',ch:'ch3',kind:'entry',t:'مختبر خاصية التوزيع',k:'خاصية',d:'فكّ الضرب إلى جزأين أسهل'},\n      {id:'mult2',ch:'ch3',kind:'entry',t:'الضرب في عددين',k:'حساب',d:'اضرب في عدد من رقمين'},\n      {id:'divpat',ch:'ch4',kind:'entry',t:'أنماط القسمة والتقدير',k:'نمط وتقدير',d:'قدّر ناتج القسمة بالأعداد المتناغمة'},\n      {id:'sharing',ch:'ch4',kind:'share',t:'محاكي التوزيع',k:'محاكاة',d:'وزّع الأشياء على المجموعات بالتساوي'},\n      {id:'longdiv',ch:'ch4',kind:'order',t:'بانِي خطوات القسمة',k:'ترتيب خطوات',d:'رتّب خطوات القسمة المطولة'},\n      {id:'remainder',ch:'ch4',kind:'mcq',t:'قرار الباقي',k:'تفسير الباقي',d:'ماذا نفعل بالباقي في هذا الموقف؟'},\n      {id:'mystery',ch:'ch5',kind:'entry',t:'الصندوق المجهول',k:'متغير',d:'□ + ٧ = ١٥ — ما في الصندوق؟'},\n      {id:'machine',ch:'ch5',kind:'machine',t:'آلة الدوال',k:'دالة',d:'مُدخَل ← قاعدة ← مُخرَج، وأكمل الجدول'},\n      {id:'balance',ch:'ch5',kind:'balance',t:'ميزان المعادلات',k:'ميزان',d:'أجرِ العملية على الطرفين حتى يتزن الميزان'},\n      {id:'orderops',ch:'ch5',kind:'order',t:'تحدي ترتيب العمليات',k:'ترتيب',d:'رتّب خطوات الحساب كما يقتضي ترتيب العمليات'},\n      {id:'fracbuild',ch:'ch6',kind:'frac',t:'بانِي الكسور',k:'بناء بصري',d:'قسّم الأشكال وظلّل الكسر المطلوب'},\n      {id:'improper',ch:'ch6',kind:'entry',t:'محوّل الكسور غير الفعلية',k:'تحويل',d:'من كسر غير فعلي إلى عدد كسري وبالعكس'},\n      {id:'cmpfrac',ch:'ch6',kind:'mcq',t:'حلبة مقارنة الكسور',k:'مقارنة',d:'قارن الكسرين بالنموذج قبل الرمز'},\n      {id:'fracline',ch:'ch6',kind:'numline',t:'الكسور على خط الأعداد',k:'تحديد موقع',d:'ضع الكسر أو العدد الكسري في موقعه'}\n    ];\n    this.BADGES=[\n      {id:'pv',label:'ملك القيمة المنزلية',ch:'ch1'},\n      {id:'es',label:'عبقري التقدير',ch:'ch2'},\n      {id:'mu',label:'بطل الضرب',ch:'ch3'},\n      {id:'di',label:'مكتشف الأخطاء',ch:'ch4'},\n      {id:'eq',label:'سيد المعادلات',ch:'ch5'},\n      {id:'fr',label:'خبير الكسور',ch:'ch6'}\n    ];\n    this.state={view:'home',ch:null,act:null,q:null,ui:{},fb:null,hint:0,sel:null,lvl:1,prog:this.load(),lab:'pv',labState:this.initLab()};\n  }\n  componentDidMount(){\n    this.timer=setInterval(()=>{\n      if(this.state.view!=='act') return;\n      const p=JSON.parse(JSON.stringify(this.state.prog));\n      p.mins=(p.mins||0)+1; this.save(p); this.setState({prog:p});\n    },60000);\n  }\n  componentWillUnmount(){clearInterval(this.timer);}\n\n  /* ---------- progress ---------- */\n  today(){return new Date().toISOString().slice(0,10);}\n  load(){\n    let d=null;\n    try{d=JSON.parse(localStorage.getItem(this.KEY));}catch(e){}\n    if(!d||typeof d!=='object'||!d.stats) d={points:0,streak:1,last:this.today(),stats:{},badges:[],mins:0};\n    const t=this.today();\n    if(d.last!==t){\n      const y=new Date(Date.now()-86400000).toISOString().slice(0,10);\n      d.streak=d.last===y?(d.streak||1)+1:1; d.last=t;\n    }\n    return d;\n  }\n  save(p){try{localStorage.setItem(this.KEY,JSON.stringify(p));}catch(e){}}\n  st(id){return this.state.prog.stats[id]||{c:0,a:0,run:0};}\n  mastery(id){\n    const s=this.st(id);\n    if(!s.a) return 'new';\n    const r=s.c/s.a;\n    if(s.c>=5&&r>=0.75) return 'mastered';\n    if(s.a<3) return 'dev';\n    if(r>=0.5) return 'dev';\n    return 'need';\n  }\n  masteryInfo(id){\n    return {new:{label:'لم يبدأ',bg:'var(--color-neutral-200)'},need:{label:'يحتاج تدريبًا',bg:'var(--color-accent-500)'},dev:{label:'في تقدّم',bg:'var(--color-accent-200)'},mastered:{label:'متقن',bg:'var(--color-text)'}}[this.mastery(id)];\n  }\n  record(ok){\n    const id=this.state.act;\n    const p=JSON.parse(JSON.stringify(this.state.prog));\n    const s=p.stats[id]||{c:0,a:0,run:0};\n    s.a++;\n    if(ok){s.c++;s.run=(s.run||0)+1;p.points+=Math.max(3,10+this.state.lvl*5+Math.min(20,(s.run-1)*2)-this.state.hint*3);}\n    else s.run=0;\n    p.stats[id]=s;\n    this.BADGES.forEach(b=>{\n      if(p.badges.indexOf(b.id)>=0) return;\n      const acts=this.ACT.filter(a=>a.ch===b.ch);\n      const good=acts.filter(a=>{const x=p.stats[a.id];return x&&x.c>=5&&x.c/x.a>=0.75;}).length;\n      if(acts.length&&good>=Math.min(3,acts.length)) p.badges.push(b.id);\n    });\n    this.save(p);\n    return p;\n  }\n  chapterPct(chId){\n    const acts=this.ACT.filter(a=>a.ch===chId);\n    if(!acts.length) return 0;\n    let s=0; acts.forEach(a=>{s+=Math.min(1,this.st(a.id).c/5);});\n    return Math.round(s/acts.length*100);\n  }\n\n  /* ---------- number helpers ---------- */\n  fmt(n){\n    const s=String(n).split('.');\n    return s[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g,',')+(s[1]?'.'+s[1]:'');\n  }\n  w3(v){\n    const U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];\n    const T=['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];\n    const TE=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];\n    const H=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];\n    const out=[]; const h=Math.floor(v/100), r=v%100;\n    if(h) out.push(H[h]);\n    if(r>0&&r<10) out.push(U[r]);\n    else if(r>=10&&r<20) out.push(TE[r-10]);\n    else if(r>=20){const t=Math.floor(r/10),u=r%10;out.push(u?U[u]+' و'+T[t]:T[t]);}\n    return out.join(' و');\n  }\n  words(numStr){\n    let n=String(numStr).replace(/,/g,'').replace(/^0+/,'');\n    if(!n) return 'صفر';\n    const g=[]; let s=n;\n    while(s.length){g.unshift(s.slice(-3));s=s.slice(0,-3);}\n    const P={1:['ألف','ألفان','آلاف','ألفًا'],2:['مليون','مليونان','ملايين','مليونًا'],3:['مليار','ملياران','مليارات','مليارًا']};\n    const out=[]; const gc=g.length;\n    g.forEach((grp,i)=>{\n      const pw=gc-1-i, v=parseInt(grp,10);\n      if(!v) return;\n      if(pw===0){out.push(this.w3(v));return;}\n      const f=P[pw]; if(!f){out.push(this.w3(v));return;}\n      if(v===1) out.push(f[0]);\n      else if(v===2) out.push(f[1]);\n      else if(v<=10) out.push(this.w3(v)+' lots.map(id=>ui.tiles.filter(t=>t.id===id)[0].v).join('');\n    if(built===q.num) return {ok:true,why:'العدد '+this.fmt(q.num)+' صحيح. الفواصل تفصل بين الفترات: الآحاد، الألوف، الملايين، المليارات — كل فترة ثلاث منازل.'};\n    const L=q.num.length; let i=0; while(i<L&&built[i]===q.num[i]) i++;\n    return {ok:false,why:'العدد الذي بنيته '+this.fmt(built)+'. أول اختلاف في منزلة '+this.PLACE[L-1-i]+': المطلوب هناك الرقم '+q.num[i]+' لا '+built[i]+'.'};\n  }\n  gen_detective(L){\n    const len=[5,6,7,9][L];\n    let s=this.bigNum(len);\n    let idx=this.rnd(0,len-1),tries=0;\n    while(s[idx]==='0'&&tries++<20) idx=this.rnd(0,len-1);\n    const pw=len-1-idx, d=+s[idx];\n    const pool=[pw-2,pw-1,pw+1,pw+2].filter(x=>x>=0&&x<this.PLACE.length&&x!==pw);\n    const placeOpts=this.shuffle([this.PLACE[pw]].concat(this.shuffle(pool).slice(0,3)));\n    const val=this.fmt(d*Math.pow(10,pw));\n    const distract=[this.fmt(d),this.fmt(d*Math.pow(10,Math.max(0,pw-1))),this.fmt(d*Math.pow(10,pw+1))];\n    return {num:s,idx:idx,pw:pw,d:d,placeAns:this.PLACE[pw],valAns:val,placeOpts:placeOpts,valOpts:this.optsFrom(val,distract),\n      discover:'الرقم المظلَّل يبدو صغيرًا، لكن موقعه هو ما يحدد قيمته الحقيقية.',digits:s.split('').map((c,i)=>({ch:c,hi:i===idx}))};\n  }\n  check_detective(q,ui){\n    if(!ui.place||!ui.val) return {soft:true,why:'أجب عن السؤالين معًا: المنزلة ثم القيمة.'};\n    const p=ui.place===q.placeAns,v=ui.val===q.valAns;\n    if(p&&v) return {ok:true,why:'الرقم '+q.d+' في منزلة '+q.placeAns+'، فقيمته '+q.d+' × '+this.fmt(Math.pow(10,q.pw))+' = '+q.valAns+'.'};\n    if(p&&!v) return {ok:false,why:'المنزلة صحيحة، لكن القيمة = الرقم × قيمة منزلته = '+q.d+' × '+this.fmt(Math.pow(10,q.pw))+' = '+q.valAns+'.'};\n    return {ok:false,why:'عُدّ المنازل من اليمين: الآحاد، العشرات، المئات… الرقم '+q.d+' في منزلة '+q.placeAns+' وقيمته '+q.valAns+'.'};\n  }\n  gen_expanded(L){\n    const len=[4,5,6,7][L];\n    let a=this.bigNum(len);\n    const zi=this.rnd(1,len-1); a=a.slic
